appId: ${APP_ID}
tags:
  - e2e
  - admin
  - dashboard
---
# Admin home: header, KPI grid, Recent Activity and its See All, and the tab bar.
- runFlow: ../utils/login-admin.yaml

# Header: tenant + role subtitle, search and bell are both reachable.
- extendedWaitUntil:
    visible: Operator Panel
    timeout: 60000
- assertVisible: Sri Satya Cable Network
- assertVisible: "Here's what's happening with your network today."
- assertVisible: Global Search
- assertVisible: 'Notifications.*'

# KPI grid: all four tiles are admin-visible.
- assertVisible: Total Customers
- assertVisible: Active Connections
- assertVisible: Collected Today
- assertVisible: Outstanding Dues
- assertVisible: '.* receipts today'
- assertVisible: '.* accounts due'
- takeScreenshot: .maestro/screenshots/admin-home

# Search opens the global search modal (input autofocused); back closes it.
- tapOn: Global Search
- extendedWaitUntil:
    visible: 'Search screens, actions, commands...'
    timeout: 20000
- runFlow: ../utils/hide-keyboard.yaml
- back
- extendedWaitUntil:
    notVisible: 'Search screens, actions, commands...'
    timeout: 10000

# Bell opens the notifications inbox; back returns home.
- tapOn: 'Notifications.*'
- extendedWaitUntil:
    visible: '.* total'
    timeout: 30000
- assertVisible: Notifications
- back
- extendedWaitUntil:
    visible: Operator Panel
    timeout: 20000

# Recent Activity lists rows (or its empty copy), and See All opens analytics.
- scrollUntilVisible:
    element: Recent Activity
    direction: DOWN
- assertVisible: See All
- tapOn: See All
- extendedWaitUntil:
    visible: Collections Overview
    timeout: 30000
- assertVisible: Dashboard
- back
- extendedWaitUntil:
    visible: Recent Activity
    timeout: 20000

# Every bottom tab switches the screen, and Home brings the KPIs back.
- tapOn: Customers
- extendedWaitUntil:
    visible: 'Customers & Lines'
    timeout: 30000
- tapOn: Payments
- extendedWaitUntil:
    visible: 'Payments & Collections'
    timeout: 30000
- tapOn: Remote
- extendedWaitUntil:
    visible: Choose a remote
    timeout: 30000
- tapOn: More
- extendedWaitUntil:
    visible: 'Manage services, network catalog, staff, and account'
    timeout: 30000
- tapOn: Home
- extendedWaitUntil:
    visible: Total Customers
    timeout: 30000

appId: ${APP_ID}
tags:
  - e2e
  - admin
---
# Operator panel: KPIs, quick actions, activity feed and bottom navigation.
- runFlow:
    file: ../utils/fresh-login.yaml
    env:
      EMAIL: admin@sscn.com
      PASSWORD: Admin@123456

- assertVisible: Sri Satya Cable Network
- assertVisible: Operator Panel
- assertVisible: "Here's what's happening with your network today."

# KPI grid - all four tiles are admin-visible.
- assertVisible: Total Customers
- assertVisible: Active Connections
- assertVisible: Collected Today
- assertVisible: Outstanding Dues
- takeScreenshot: .maestro/screenshots/admin-home

# Quick actions
- assertVisible: Quick Actions
- assertVisible: Add Customer
- assertVisible: Collect Payment
- assertVisible: Receipts
- assertVisible: Complaints

- scroll
- assertVisible: Recent Activity

# Bottom navigation across every tab.
- tapOn: Customers
- assertVisible: 'Customers & Lines'
- tapOn: Payments
- assertVisible: 'Payments & Collections'
- tapOn: Remote
- tapOn: More
- tapOn: Home
- assertVisible: Quick Actions

# Quick action deep-links into the customers tab with the wizard open.
- tapOn: Add Customer
- assertVisible: Add New Customer
- tapOn:
    id: add-customer-close

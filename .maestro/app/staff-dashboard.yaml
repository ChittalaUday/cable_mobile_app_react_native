appId: ${APP_ID}
tags:
  - e2e
  - staff
---
# Field staff land on their scoped operational dashboard, not the admin panel.
- runFlow:
    file: ../utils/fresh-login.yaml
    env:
      EMAIL: suresh.staff@sscn.com
      PASSWORD: Staff@123456

- assertVisible: .*Suresh.*
- assertVisible: Field Officer
- assertNotVisible: Operator Panel
- assertVisible: Quick Actions
- assertVisible: Personal
- assertVisible: Collected today
- assertVisible: Workload
- takeScreenshot: .maestro/screenshots/staff-home

# Tab bar: same five destinations as the office, scoped to this officer.
- tapOn: Payments
- assertVisible: My Collections
- tapOn: More
- assertVisible: Complaints
- assertVisible: Inventory
- assertNotVisible: Staff & Teams
- tapOn: Home
- assertVisible: Collected today

# Search only offers what a field officer can open.
- tapOn: Global Search
- inputText: issue
- assertVisible: Issue Equipment
- eraseText: 5
- inputText: package
- assertNotVisible: Packages & Plans

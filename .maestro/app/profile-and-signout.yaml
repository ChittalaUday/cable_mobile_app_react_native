appId: ${APP_ID}
tags:
  - e2e
  - auth
---
# Profile screen, then sign out returns to the login screen (not onboarding).
- runFlow:
    file: ../utils/fresh-login.yaml
    env:
      EMAIL: admin@sscn.com
      PASSWORD: Admin@123456
- assertVisible: Operator Panel

- tapOn: Profile
- assertVisible: Profile
- assertVisible: admin@sscn.com
- assertVisible: Account details
- assertVisible: Notifications
- assertVisible: Language
- assertVisible: 'Help & support'

- tapOn: Sign out
- assertVisible: Welcome Back
- assertNotVisible: Operator Panel

# Session is gone - relaunching must not restore the operator panel.
- runFlow: ../utils/open-dev-build.yaml
- assertVisible: Welcome Back

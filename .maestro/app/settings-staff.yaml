appId: ${APP_ID}
tags:
  - e2e
  - staff
  - settings
---
# Staff profile: theme and language are here too, without the office-only UPI handles.
- runFlow: ../utils/login-staff.yaml
- extendedWaitUntil:
    visible: Field Officer
    timeout: 30000
- runFlow: ../utils/account-open-settings.yaml

- assertVisible: Language
- assertVisible: Theme
- assertNotVisible: UPI handles
- assertNotVisible: Privacy Policy

# Language works for staff too: Telugu and back.
- tapOn: Language
- extendedWaitUntil:
    visible:
      id: settings-language-item-te
    timeout: 10000
- tapOn:
    id: settings-language-item-te
- extendedWaitUntil:
    visible: భాష
    timeout: 10000
- tapOn: భాష
- extendedWaitUntil:
    visible:
      id: settings-language-item-en
    timeout: 10000
- tapOn:
    id: settings-language-item-en
- extendedWaitUntil:
    visible: Language
    timeout: 10000

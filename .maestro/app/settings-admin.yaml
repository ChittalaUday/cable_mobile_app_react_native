appId: ${APP_ID}
tags:
  - e2e
  - admin
  - settings
---
# Admin profile: theme and language live in Profile (there is no Settings
# page), UPI handles are reachable for an admin, and none of the template's
# placeholder rows (share, rate, privacy, links) remain.
- runFlow: ../utils/login-admin.yaml
- extendedWaitUntil:
    visible: Operator Panel
    timeout: 30000
- runFlow: ../utils/account-open-settings.yaml

# --- Renders ------------------------------------------------------------------
- assertVisible: Theme
- assertVisible: Language
- assertVisible: English
- assertVisible: UPI handles
- assertVisible: Sign out
- assertNotVisible: Share
- assertNotVisible: Rate
- assertNotVisible: Privacy Policy
- assertNotVisible: Github

# --- Language: Telugu translates the rows, English restores them -------------
- tapOn: Language
- extendedWaitUntil:
    visible:
      id: settings-language-item-te
    timeout: 10000
- tapOn:
    id: settings-language-item-te
- extendedWaitUntil:
    visible: భాష
    timeout: 10000
- assertVisible: థీమ్
- tapOn: భాష
- extendedWaitUntil:
    visible:
      id: settings-language-item-en
    timeout: 10000
- tapOn:
    id: settings-language-item-en
- extendedWaitUntil:
    visible: Language
    timeout: 10000

# --- Theme: dark, then back to light ------------------------------------------
- tapOn: Theme
- extendedWaitUntil:
    visible:
      id: settings-theme-item-dark
    timeout: 10000
- assertVisible:
    id: settings-theme-item-system
- tapOn:
    id: settings-theme-item-dark
- extendedWaitUntil:
    visible: 'Dark.*'
    timeout: 10000
- tapOn: Theme
- tapOn:
    id: settings-theme-item-light
- extendedWaitUntil:
    visible: 'Light.*'
    timeout: 10000

# --- UPI handles opens its own screen; Back returns ---------------------------
- tapOn: UPI handles
- extendedWaitUntil:
    visible: Where collected money arrives
    timeout: 20000
- tapOn: Back
- extendedWaitUntil:
    visible: Appearance
    timeout: 10000

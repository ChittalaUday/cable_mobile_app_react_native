appId: ${APP_ID}
env:
  PROVIDER: Satya Fiber
tags:
  - e2e
  - admin
  - packages
---
# Provider Packages, the full cycle on a uniquely named plan:
# create -> find by search -> filter by status -> edit (price, deactivate)
# -> delete, where Cancel keeps it and Delete package removes it.
- evalScript: ${output.stamp = String(Date.now()).slice(-6)}
- runFlow: ../utils/login-admin.yaml
- openLink: ${DEV_SCHEME}://admin/packages
- extendedWaitUntil:
    visible: Provider Packages
    timeout: 30000

# --- Renders ------------------------------------------------------------------
- assertVisible: Provider rates behind your plans — not shown to customers
- assertVisible:
    id: add-package-button
- assertVisible:
    id: package-search-input
- assertVisible: 'Filter: All'
- assertVisible: 'Filter: Active'
- assertVisible: 'Filter: Inactive'
- extendedWaitUntil:
    notVisible: Loading package catalogue…
    timeout: 30000

# --- CREATE -------------------------------------------------------------------
- tapOn:
    id: add-package-button
- extendedWaitUntil:
    visible: Create a new package
    timeout: 10000
- tapOn:
    id: package-name-input
- inputText: E2E Pack ${output.stamp}
- tapOn: Choose provider
- tapOn: ${PROVIDER}
- tapOn:
    id: package-price-input
- inputText: '349'
- runFlow: ../utils/hide-keyboard.yaml
- tapOn: Monthly
- tapOn: Quarterly
- tapOn: Enter package description...
- inputText: E2E plan ${output.stamp}
- runFlow: ../utils/hide-keyboard.yaml
- tapOn: Save Package
# The confirm step echoes what is about to be saved.
- extendedWaitUntil:
    visible: '.*E2E Pack ${output.stamp} — ₹349 quarterly.*'
    timeout: 10000
- assertVisible: '.*Provider: ${PROVIDER}.*'
- tapOn:
    id: dialog-confirm
- extendedWaitUntil:
    visible: Provider Packages
    timeout: 30000

# --- READ: search narrows to the new plan ---------------------------------------
- tapOn:
    id: package-search-input
- inputText: E2E Pack ${output.stamp}
- extendedWaitUntil:
    visible: E2E Pack ${output.stamp}
    timeout: 20000
- assertVisible: '.*349.*'
- assertVisible: '.* / 3 mo.*'
- assertVisible: E2E plan ${output.stamp}
- assertVisible: Active
- runFlow: ../utils/hide-keyboard.yaml

# Status filters: an active plan shows under Active, not under Inactive.
- tapOn: 'Filter: Inactive'
- assertNotVisible: E2E Pack ${output.stamp}
- tapOn: 'Filter: Active'
- assertVisible: E2E Pack ${output.stamp}
- tapOn: 'Filter: All'

# --- UPDATE: new price, and take it off sale ------------------------------------
- tapOn: Edit E2E Pack ${output.stamp}
- extendedWaitUntil:
    visible: Update package details
    timeout: 10000
- assertVisible: E2E Pack ${output.stamp}
- assertVisible: Package coverage
- tapOn:
    id: package-price-input
- eraseText: 10
- inputText: '399'
- runFlow: ../utils/hide-keyboard.yaml
- scrollUntilVisible:
    element:
      id: package-active-toggle
- tapOn:
    id: package-active-toggle
- tapOn: Save Changes
- extendedWaitUntil:
    visible: Save changes
    timeout: 10000
- assertVisible: '.*E2E Pack ${output.stamp} — ₹399.*Inactive.*'
- tapOn:
    id: dialog-confirm
- extendedWaitUntil:
    visible: Provider Packages
    timeout: 30000
- extendedWaitUntil:
    visible: '.*399.*'
    timeout: 20000
- assertVisible: Inactive
# Now off sale: listed under Inactive, gone from Active.
- tapOn: 'Filter: Active'
- assertNotVisible: E2E Pack ${output.stamp}
- tapOn: 'Filter: Inactive'
- assertVisible: E2E Pack ${output.stamp}
- tapOn: 'Filter: All'

# --- DELETE: Cancel keeps it ---------------------------------------------------
- tapOn: Delete E2E Pack ${output.stamp}
- extendedWaitUntil:
    visible: Delete package
    timeout: 10000
- assertVisible: '.*Delete "E2E Pack ${output.stamp}"\?.*'
- tapOn:
    id: dialog-cancel
- extendedWaitUntil:
    notVisible: Delete package
    timeout: 10000
- assertVisible: E2E Pack ${output.stamp}

# --- DELETE: confirm removes it -------------------------------------------------
- tapOn: Delete E2E Pack ${output.stamp}
- extendedWaitUntil:
    visible: Delete package
    timeout: 10000
- tapOn:
    id: dialog-confirm
- extendedWaitUntil:
    visible: No packages found
    timeout: 20000
- assertVisible: 'No plan matched "E2E Pack ${output.stamp}".'

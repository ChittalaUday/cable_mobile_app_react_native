flows:
  - auth/*
  - app/*

excludeTags:
  - util

executionOrder:
  continueOnFailure: false # default is true
  flowsOrder:
    # Auth first: first launch -> validation -> the two non-admin roles.
    - first-launch
    - login-with-validation
    - guest-login
    # Admin surface.
    - admin-dashboard
    - global-search
    # Plans and provider packages: CRUD, RBAC, and the plan link onto customers.
    - packages-crud
    - packages-permissions
    - add-customer-flow
    - plans-on-customers
    # Other roles and sign-out last (sign-out clears the session).
    - customer-dashboard
    - staff-dashboard
    - profile-and-signout

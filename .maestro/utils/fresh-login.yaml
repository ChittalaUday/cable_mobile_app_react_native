appId: ${APP_ID}
tags:
  - util
---
# Wipes app state and signs in as ${EMAIL}.
# Callers must pass EMAIL and PASSWORD (backend database seed). No defaults here:
# a subflow's own env block overrides the caller's, so defaults would force admin.
- clearState
- runFlow: open-dev-build.yaml
- assertVisible: Welcome Back
- tapOn:
    id: email-input
- inputText: ${EMAIL}
- tapOn:
    id: password-input
- inputText: ${PASSWORD}
- runFlow: hide-keyboard.yaml
- tapOn:
    id: login-button
# REST authentication round trip, then the role-based dashboard mounts.
- extendedWaitUntil:
    notVisible: Welcome Back
    timeout: 60000
- runFlow: dismiss-system-dialogs.yaml
# Operator roles are held behind the location gate until location is allowed.
- extendedWaitUntil:
    visible:
      id: location-gate
    timeout: 5000
    optional: true
- runFlow:
    when:
      visible:
        id: location-gate
    commands:
      - tapOn:
          id: location-gate-enable
      - runFlow:
          when:
            visible: While using the app
          commands:
            - tapOn: While using the app
      - extendedWaitUntil:
          notVisible:
            id: location-gate
          timeout: 15000

appId: ${APP_ID}
tags:
  - util
---
# Expo dev-client builds boot into the launcher UI and, after a clearState, also
# show the one-time developer-menu intro. Both are dev-only chrome that would
# otherwise break automation, so we skip straight past them:
#   1. deep-link directly at the Metro server (never touches the launcher list)
#   2. dismiss the developer-menu intro and the dev menu sheet if they appear
# On a release build neither exists; the optional steps simply lapse.
- openLink: ${DEV_SCHEME}://expo-development-client/?url=${DEV_SERVER}

- extendedWaitUntil:
    visible: This is the developer menu. It gives you access to useful tools in your development builds.
    timeout: 15000
    optional: true
- runFlow:
    when:
      visible: This is the developer menu. It gives you access to useful tools in your development builds.
    commands:
      - tapOn: Continue

# Dismiss the dev menu sheet itself so the app is on screen.
- runFlow:
    when:
      visible: Performance monitor
    commands:
      - back

- runFlow: dismiss-system-dialogs.yaml
- runFlow:
    when:
      visible: 'Connected to:'
    commands:
      - back

- extendedWaitUntil:
    visible: Satya Cable
    timeout: 120000

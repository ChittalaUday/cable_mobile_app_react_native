appId: ${APP_ID}
env:
  EMAIL: admin@satyacable.dev
  PASSWORD: Passw0rd!
tags:
  - e2e
  - auth
---
- clearState
- runFlow: ../utils/open-dev-build.yaml

# Empty submit is rejected before any network call.
- assertVisible:
    id: login-button
- tapOn:
    id: login-button
- assertVisible: Please enter your email and password.

# Wrong password is rejected by Firebase Auth.
- tapOn:
    id: email-input
- inputText: ${EMAIL}
- tapOn:
    id: password-input
- inputText: wrong-password
- tapOn:
    id: login-button
# The transient flash message is not asserted - it auto-dismisses in ~2s.
# What matters is the durable outcome: sign-in was refused, so we stay put.
- assertVisible: Welcome Back
- assertNotVisible: Operator Panel

# Sign-up mode asks for confirmation and rejects a mismatch.
- tapOn: New here? Create an account
- assertVisible: Create Account
- tapOn:
    id: confirm-password-input
- inputText: something-else
- tapOn:
    id: login-button
- assertVisible: "Those passwords don't match."
- tapOn: Already have an account? Sign in

# Correct credentials reach the operator panel.
- tapOn:
    id: password-input
- eraseText: 20
- inputText: ${PASSWORD}
- tapOn:
    id: login-button
- runFlow: ../utils/dismiss-system-dialogs.yaml
- extendedWaitUntil:
    visible: Operator Panel
    timeout: 60000
